<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Raster UI 交互验证</title><link rel="stylesheet" href="../raster-ui.css"><script defer src="../raster-ui.js"></script><script defer src="motion-tests.js"></script></head><body class="rg-root" style="padding:32px;background:var(--rg-surface)"><h1>交互验证</h1><p>覆盖动画取消、弹窗竞态、减少动态效果与撤销。测试结束后恢复原动态偏好。</p><button id="run" class="rg-button">运行验证</button><ol id="results" aria-live="polite"></ol><p id="summary" role="status">尚未运行</p><div id="fixture"><button id="origin" class="rg-button">焦点来源</button><button id="busy" class="rg-button" aria-label="原标签">忙碌按钮</button><div id="panel">动画测试面板</div><div data-rg-segmented id="segments" aria-label="测试筛选"><button class="rg-segment" data-value="a" aria-pressed="true">A</button><button class="rg-segment" data-value="b" aria-pressed="false">B</button></div><dialog class="rg-dialog rg-root" id="dialog" aria-labelledby="dialog-title"><h2 id="dialog-title">验证弹窗</h2><form method="dialog"><input class="rg-input" aria-label="测试输入" autofocus><button class="rg-button" value="submitted">提交</button></form></dialog></div><a href="../index.html#experience">返回组件库</a></body></html>
