<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>工作空间 · Raster UI 示例</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath fill='%23203227' d='M1 1h6v6H1zm8 0h6v6H9zM1 9h6v6H1zm8 0h6v6H9z'/%3E%3C/svg%3E"><link rel="stylesheet" href="../raster-ui.css"><script defer src="../raster-ui.js"></script>
<style>
body{margin:0;background:var(--rg-canvas)}.example-shell{max-width:1200px;margin:24px auto;padding:0 24px}.example-brand{font:600 18px var(--rg-mono);letter-spacing:1px;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between}.example-brand a{font:12px var(--rg-font);color:var(--rg-muted)}.example-layout{display:grid;grid-template-columns:150px minmax(0,1fr);padding:0!important}.example-aside{background:var(--rg-subtle);border-right:1px solid var(--rg-line);padding:28px 0}.example-main{padding:28px;min-width:0}.example-heading{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--rg-ink);padding-bottom:22px;gap:16px}.example-heading h1{font-size:36px;margin:0;line-height:1.3}.example-heading p{font-size:14px;color:var(--rg-muted);margin:6px 0 0}.example-count{font:48px var(--rg-mono);font-weight:700}.example-toolbar{display:flex;gap:14px;flex-wrap:wrap;margin:24px 0}.example-toolbar .rg-search{flex:1;min-width:180px}.example-toolbar .rg-button{margin-left:auto}.example-note{font-size:12px;color:var(--rg-muted);margin:18px 0 0}.example-mobile-nav{display:none}.rg-card__main{gap:16px}.rg-card__title{font-size:21px}.example-main .rg-card__main>.rg-icon{width:48px;height:48px}
@media(max-width:800px){.example-shell{padding:0 16px;margin-top:18px}.example-layout{grid-template-columns:110px minmax(0,1fr)}.example-aside .rg-nav__item{padding-left:14px;padding-right:12px;gap:12px;font-size:14px}.example-main{padding:22px}.example-toolbar .rg-search{flex-basis:100%}.rg-card-grid{grid-template-columns:1fr}}
@media(max-width:640px){body{background:var(--rg-surface)}.example-shell{padding:0;margin:0 0 82px}.example-brand{padding:18px 20px 0;font-size:16px}.example-brand a{display:none}.example-shell>.rg-frame{padding:0;background:none;clip-path:none}.example-layout{display:block;clip-path:none}.example-aside{display:none}.example-main{padding:14px 20px 24px}.example-heading h1{font-size:28px}.example-heading{padding-bottom:0;border:0}.example-count{font-size:36px}.example-toolbar{gap:12px;margin:20px 0}.example-toolbar>.rg-button{display:none}.example-toolbar .rg-segmented{width:100%}.example-mobile-nav{display:flex;position:fixed;left:0;bottom:0;width:100%;z-index:5}.example-main .rg-card__title{font-size:19px}.rg-toaster{bottom:90px}}
</style></head><body class="rg-root">
<div class="example-shell"><header class="example-brand"><span>RASTER GRID</span><a href="../index.html">返回组件库</a></header><div class="rg-frame"><div class="rg-frame__body example-layout"><aside class="example-aside"><nav class="rg-nav" aria-label="主导航"><a class="rg-nav__item" href="workspace.html" aria-current="page"><svg class="rg-icon" aria-hidden="true"><use href="#rg-i-folder"/></svg>项目</a><a class="rg-nav__item" href="../index.html"><svg class="rg-icon" aria-hidden="true"><use href="#rg-i-grid"/></svg>组件库</a></nav></aside><main class="example-main"><header class="example-heading"><div><h1>项目</h1><p>把工作保持有序</p></div><span class="example-count" id="count" aria-label="4 个项目">04</span></header><div class="example-toolbar"><label class="rg-search"><svg class="rg-icon" aria-hidden="true"><use href="#rg-i-search"/></svg><input type="search" placeholder="搜索项目" aria-label="搜索项目" id="search"></label><div class="rg-segmented" data-rg-segmented id="filters" aria-label="项目状态"><button class="rg-segment" data-value="all" aria-pressed="true">全部</button><button class="rg-segment" data-value="active" aria-pressed="false">进行中</button><button class="rg-segment" data-value="done" aria-pressed="false">已完成</button></div><button class="rg-button" data-rg-open="create-dialog"><svg class="rg-icon" aria-hidden="true"><use href="#rg-i-add"/></svg>新建项目</button></div><div class="rg-card-grid" id="cards"></div><p class="example-note" id="results" role="status"></p><p class="example-note">组件组合演示 · 本页数据在刷新后恢复</p></main></div></div></div>
<nav class="rg-bottom-nav example-mobile-nav" aria-label="移动端导航"><a class="rg-nav__item" href="workspace.html" aria-current="page"><svg class="rg-icon" aria-hidden="true"><use href="#rg-i-folder"/></svg>项目</a><a class="rg-nav__item" href="../index.html"><svg class="rg-icon" aria-hidden="true"><use href="#rg-i-grid"/></svg>组件库</a><button class="rg-nav__item" data-rg-open="create-dialog"><svg class="rg-icon" aria-hidden="true"><use href="#rg-i-plus"/></svg>新建</button></nav>
<dialog class="rg-dialog rg-root" id="create-dialog" aria-labelledby="create-title"><header class="rg-dialog__header"><h2 class="rg-dialog__title" id="create-title">新建项目</h2><button class="rg-button rg-button--quiet rg-button--icon" data-rg-close aria-label="关闭"><svg class="rg-icon" aria-hidden="true"><use href="#rg-i-close"/></svg></button></header><form class="rg-dialog__body" id="create-form"><label class="rg-field"><span class="rg-label">项目名称</span><input class="rg-input" name="name" required maxlength="30" autofocus placeholder="输入名称"></label><label class="rg-field" style="margin-top:16px"><span class="rg-label">简短说明</span><textarea class="rg-textarea" name="description" maxlength="100" placeholder="这个项目准备完成什么？"></textarea></label><div class="rg-dialog__footer"><button type="button" class="rg-button rg-button--secondary" data-rg-close>取消</button><button type="submit" class="rg-button">创建项目</button></div></form></dialog>
<dialog class="rg-dialog rg-root" id="detail-dialog" aria-labelledby="detail-title"><header class="rg-dialog__header"><h2 class="rg-dialog__title" id="detail-title">项目详情</h2><button class="rg-button rg-button--quiet rg-button--icon" data-rg-close aria-label="关闭详情"><svg class="rg-icon" aria-hidden="true"><use href="#rg-i-close"/></svg></button></header><div class="rg-dialog__body"><p id="detail-description"></p><span class="rg-status" id="detail-status"></span><div class="rg-dialog__footer"><button class="rg-button" data-rg-close>完成</button></div></div></dialog>
<script>
document.addEventListener('DOMContentLoaded',()=>{
 const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const records=[{name:'设计系统',type:'design',state:'active',desc:'统一产品的视觉与交互规范',en:'Design System',date:'10.08'},{name:'产品网站',type:'web',state:'pending',desc:'官网重构与内容建设',en:'Product Website',date:'10.07'},{name:'移动应用',type:'phone',state:'active',desc:'iOS 与 Android 客户端',en:'Mobile Application',date:'10.06'},{name:'组件文档',type:'doc',state:'done',desc:'组件使用说明与示例',en:'Component Docs',date:'10.05'}];
 const labels={active:'进行中',pending:'待开始',done:'已完成'};let filter='all';
 function render(){const term=$('#search').value.trim().toLowerCase(),visible=records.filter(p=>(filter==='all'||p.state===filter)&&(p.name+' '+p.desc+' '+p.en).toLowerCase().includes(term));$('#cards').innerHTML=visible.map(p=>`<button class="rg-card ${records.indexOf(p)===0?'rg-card--selected':''}" data-index="${records.indexOf(p)}"><span class="rg-card__index">${String(records.indexOf(p)+1).padStart(2,'0')}</span><span class="rg-card__main"><svg class="rg-icon rg-icon--48" aria-hidden="true"><use href="#rg-i-${p.type}"/></svg><span class="rg-card__content"><span class="rg-card__title">${esc(p.name)}</span><span class="rg-status ${p.state==='active'?'':'rg-status--'+p.state}">${labels[p.state]}</span></span><span class="rg-card__arrow"><svg class="rg-icon" aria-hidden="true"><use href="#rg-i-arrow"/></svg></span></span><span class="rg-card__footer"><span><span class="rg-card__description">${esc(p.desc||'暂无说明')}</span><span class="rg-card__meta">${p.en}</span></span><time>${p.date}</time></span></button>`).join('')||'<div class="rg-empty" style="grid-column:1/-1"><h3>没有找到相关项目</h3><p>试试其他关键词或筛选条件。</p><button class="rg-button rg-button--secondary" id="reset">清除搜索与筛选</button></div>';$('#results').textContent='共 '+visible.length+' 个项目';$('#count').textContent=String(records.length).padStart(2,'0');$('#count').setAttribute('aria-label',records.length+' 个项目');}
 $('#search').addEventListener('input',render);$('#filters').addEventListener('rg:change',e=>{filter=e.detail.value;render();RasterUI.reveal($('#cards'),{children:'.rg-card'});});
 $('#cards').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='reset'){$('#search').value='';$('#filters [data-value="all"]').click();filter='all';render();return;}const p=records[Number(b.dataset.index)];if(!p)return;$('#detail-title').textContent=p.name;$('#detail-description').textContent=p.desc||'暂无说明';$('#detail-status').textContent=labels[p.state];$('#detail-status').className='rg-status '+(p.state==='active'?'':'rg-status--'+p.state);RasterUI.openDialog('detail-dialog',b);});
 $('#create-form').addEventListener('submit',async e=>{e.preventDefault();const name=e.currentTarget.elements.name;if(!name.value.trim()){name.setCustomValidity('请输入项目名称。');name.reportValidity();return;}const d=new Date();records.unshift({name:name.value.trim(),desc:e.currentTarget.elements.description.value.trim(),type:'folder',state:'pending',en:'New Project',date:String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0')});$('#search').value='';$('#filters [data-value="all"]').click();filter='all';render();const form=e.currentTarget,submit=e.submitter;RasterUI.setLoading(submit,true,'正在创建');await RasterUI.closeDialog('create-dialog','created');form.reset();RasterUI.setLoading(submit,false);RasterUI.reveal($('#cards'),{children:'.rg-card'});RasterUI.toast('已创建演示项目。');});$('#create-form input').addEventListener('input',e=>e.target.setCustomValidity(''));
 render();
});
</script></body></html>
