<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>工作空间 · Raster UI 示例</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath fill='%23203227' d='M1 1h6v6H1zm8 0h6v6H9zM1 9h6v6H1zm8 0h6v6H9z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../raster-ui.css">
<script defer src="../raster-ui.js"></script>
<style>
body{margin:0;background:var(--rg-canvas)}
.example-shell{max-width:1200px;margin:28px auto;padding:0 24px}
.example-brand{font:600 18px var(--rg-mono);letter-spacing:1px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.example-brand a{font:12px var(--rg-font);color:var(--rg-muted-canvas)}
.example-layout{display:grid;grid-template-columns:150px minmax(0,1fr);padding:0!important}
.example-aside{background:var(--rg-subtle);border-right:1px solid var(--rg-line);padding:28px 0}
.example-main{padding:32px;min-width:0}
.example-heading{display:flex;align-items:center;justify-content:space-between;padding-bottom:24px;gap:20px}
.example-heading h1{font-size:36px;margin:0;line-height:1.3}
.example-heading p{font-size:14px;color:var(--rg-muted);margin:6px 0 0}
.example-total{display:grid;justify-items:end;gap:2px;flex-shrink:0}
.example-count{font:700 40px/1.1 var(--rg-mono)}
.example-total small{font-size:12px;color:var(--rg-muted)}
.example-toolbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-bottom:20px}
.example-toolbar .rg-search{flex:1;min-width:180px}
.example-toolbar>.rg-button{margin-left:auto}
.example-controls{border-top:1px solid var(--rg-line);padding-top:16px;margin-bottom:20px;display:flex;flex-wrap:wrap;align-items:center;gap:14px}
.example-controls>.rg-segmented:first-child{margin-right:auto}
.example-view-options{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.example-view-options .rg-segment{min-height:40px;padding:8px 12px;font-size:13px}
.example-view-options .rg-switch{font-size:13px}
.example-results{display:flex;gap:8px 16px;justify-content:space-between;flex-wrap:wrap;font-size:13px;color:var(--rg-muted);margin:0 0 14px}
#current-project{color:var(--rg-ink);overflow-wrap:anywhere;min-width:0}
.example-note{font-size:12px;color:var(--rg-muted);margin:24px 0 0}
.example-mobile-nav{display:none}
.example-main .rg-card__main{gap:16px}
.example-main .rg-card__title{font-size:21px}
.example-main .rg-card__main>.rg-icon{width:48px;height:48px}
.example-form-field+.example-form-field{margin-top:20px}
.example-field-error:empty{display:none}
.example-form-note{margin:0 0 24px;color:var(--rg-muted);font-size:14px}
@media(max-width:900px){.example-shell{padding:0 16px;margin-top:18px}.example-layout{grid-template-columns:110px minmax(0,1fr)}.example-aside .rg-nav__item{padding-left:14px;padding-right:12px;gap:12px;font-size:14px}.example-main{padding:24px}.example-main .rg-card-grid{grid-template-columns:1fr}.example-view-options{gap:12px}}
@media(max-width:640px){body{background:var(--rg-surface)}.example-shell{padding:0;margin:0 0 calc(96px + env(safe-area-inset-bottom))}.example-brand{padding:18px 20px 0;font-size:16px}.example-brand a{display:none}.example-shell>.rg-frame{padding:0;background:none;clip-path:none}.example-layout{display:block;clip-path:none}.example-aside{display:none}.example-main{padding:16px 20px 24px}.example-heading h1{font-size:28px}.example-heading{padding-bottom:20px}.example-count{font-size:32px}.example-toolbar{gap:12px;padding-bottom:20px}.example-toolbar>.rg-button{display:none}.example-controls{gap:14px;margin-bottom:16px}.example-controls>.rg-segmented:first-child{width:100%}.example-view-options{width:100%;justify-content:space-between}.example-mobile-nav{display:flex;position:fixed;left:0;bottom:0;width:100%;z-index:5}.example-mobile-nav .example-new{background:var(--rg-ink);color:var(--rg-surface);clip-path:var(--rg-cut)}.example-main .rg-card__title{font-size:19px}.example-results{font-size:12px}.example-main .rg-toaster,.rg-toaster{bottom:calc(90px + env(safe-area-inset-bottom))}}
@media(pointer:coarse){.example-view-options .rg-segment{min-height:44px}}
</style>
</head>
<body class="rg-root">
<div class="example-shell">
  <header class="example-brand"><span>RASTER GRID</span><a href="../index.html">返回组件库</a></header>
  <div class="rg-frame"><div class="rg-frame__body example-layout">
    <aside class="example-aside"><nav class="rg-nav" aria-label="主导航">
      <a class="rg-nav__item" href="workspace.html" aria-current="page"><svg class="rg-icon" aria-hidden="true"><use href="#rg-i-folder"/></svg>项目</a>
      <a class="rg-nav__item" href="../index.html"><svg class="rg-icon" aria-hidden="true"><use href="#rg-i-grid"/></svg>组件库</a>
    </nav></aside>
    <main class="example-main" id="workspace-main">
      <header class="example-heading"><div><h1>项目</h1><p>把工作保持有序</p></div><div class="example-total"><span class="example-count" id="count" aria-label="总计 4 个项目">04</span><small>项目总数</small></div></header>
      <div class="example-toolbar">
        <label class="rg-search"><svg class="rg-icon" aria-hidden="true"><use href="#rg-i-search"/></svg><input type="search" placeholder="搜索项目名称或说明" aria-label="搜索项目" id="search" autocomplete="off"></label>
        <button type="button" class="rg-button" data-rg-open="create-dialog"><svg class="rg-icon" aria-hidden="true"><use href="#rg-i-add"/></svg>新建项目</button>
      </div>
      <div class="example-controls">
        <div class="rg-segmented" data-rg-segmented id="filters" aria-label="项目状态">
          <button type="button" class="rg-segment" data-value="all" aria-pressed="true">全部</button>
          <button type="button" class="rg-segment" data-value="active" aria-pressed="false">进行中</button>
          <button type="button" class="rg-segment" data-value="done" aria-pressed="false">已完成</button>
        </div>
        <div class="example-view-options">
          <div class="rg-segmented" data-rg-segmented id="display-control" aria-label="项目显示方式">
            <button type="button" class="rg-segment" data-value="cards" aria-pressed="true">卡片</button>
            <button type="button" class="rg-segment" data-value="list" aria-pressed="false">列表</button>
          </div>
          <label class="rg-switch"><input type="checkbox" role="switch" id="compact-control"><span class="rg-switch__track" aria-hidden="true"></span>紧凑间距</label>
        </div>
      </div>
      <div class="example-results"><span id="results" role="status" aria-atomic="true"></span><span id="current-project"></span></div>
      <div class="rg-card-grid" id="cards"></div>
      <p class="example-note">本地组件演示 · 项目、显示方式和未提交内容在刷新后恢复初始状态</p>
    </main>
  </div></div>
</div>
<nav class="rg-bottom-nav example-mobile-nav" aria-label="移动端导航" data-rg-particle-exclude>
  <a class="rg-nav__item" href="workspace.html" aria-current="page"><svg class="rg-icon" aria-hidden="true"><use href="#rg-i-folder"/></svg>项目</a>
  <a class="rg-nav__item" href="../index.html"><svg class="rg-icon" aria-hidden="true"><use href="#rg-i-grid"/></svg>组件库</a>
  <button type="button" class="rg-nav__item example-new" data-rg-open="create-dialog"><svg class="rg-icon" aria-hidden="true"><use href="#rg-i-plus"/></svg>新建</button>
</nav>
<dialog class="rg-dialog rg-root" id="create-dialog" aria-labelledby="create-title">
  <header class="rg-dialog__header"><h2 class="rg-dialog__title" id="create-title">新建项目</h2><button type="button" class="rg-button rg-button--quiet rg-button--icon" data-rg-close aria-label="关闭"><svg class="rg-icon" aria-hidden="true"><use href="#rg-i-close"/></svg></button></header>
  <form class="rg-dialog__body" id="create-form" novalidate>
    <p class="example-form-note">先给项目一个名称，说明可以稍后补充。</p>
    <label class="rg-field example-form-field"><span class="rg-label">项目名称 <span aria-hidden="true">*</span></span><input class="rg-input" name="name" required maxlength="30" autofocus placeholder="输入名称" aria-describedby="project-name-help project-name-error"><span class="rg-help" id="project-name-help">必填，最多 30 个字符。</span><span class="rg-help rg-help--error example-field-error" id="project-name-error" aria-live="polite"></span></label>
    <label class="rg-field example-form-field"><span class="rg-label">简短说明 <span class="rg-help">（选填）</span></span><textarea class="rg-textarea" name="description" maxlength="100" placeholder="这个项目准备完成什么？" aria-describedby="project-description-help project-description-error"></textarea><span class="rg-help" id="project-description-help">最多 100 个字符。</span><span class="rg-help rg-help--error example-field-error" id="project-description-error" aria-live="polite"></span></label>
    <div class="rg-dialog__footer"><button type="button" class="rg-button rg-button--secondary" data-rg-close>取消</button><button type="submit" class="rg-button">创建项目</button></div>
  </form>
</dialog>
<dialog class="rg-dialog rg-root" id="detail-dialog" aria-labelledby="detail-title">
  <header class="rg-dialog__header"><h2 class="rg-dialog__title" id="detail-title">项目详情</h2><button type="button" class="rg-button rg-button--quiet rg-button--icon" data-rg-close aria-label="关闭详情"><svg class="rg-icon" aria-hidden="true"><use href="#rg-i-close"/></svg></button></header>
  <div class="rg-dialog__body"><p id="detail-description"></p><span class="rg-status" id="detail-status"></span><div class="rg-dialog__footer"><button type="button" class="rg-button" data-rg-close>完成</button></div></div>
</dialog>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const $ = selector => document.querySelector(selector);
  const esc = value => String(value).replace(/[&<>"']/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[character]));
  const records = [
    {id:1,name:'设计系统',type:'design',state:'active',desc:'统一产品的视觉与交互规范',en:'Design System',date:'2026-10-08'},
    {id:2,name:'产品网站',type:'web',state:'pending',desc:'官网重构与内容建设',en:'Product Website',date:'2026-10-07'},
    {id:3,name:'移动应用',type:'phone',state:'active',desc:'iOS 与 Android 客户端',en:'Mobile Application',date:'2026-10-06'},
    {id:4,name:'组件文档',type:'doc',state:'done',desc:'组件使用说明与示例',en:'Component Docs',date:'2026-10-05'}
  ];
  const labels = {active:'进行中',pending:'待开始',done:'已完成'};
  let filter = 'all', selectedId = null, nextId = 5, creating = false;
  const form = $('#create-form');
  const fields = [form.elements.name, form.elements.description];

  function updateSelection() {
    $('#cards').querySelectorAll('[data-id]').forEach(button => {
      const selected = Number(button.dataset.id) === selectedId;
      button.classList.toggle('rg-card--selected', selected);
      if (selected) button.setAttribute('aria-current', 'true');
      else button.removeAttribute('aria-current');
    });
    const selected = records.find(record => record.id === selectedId);
    $('#current-project').textContent = selected ? '当前项目：' + selected.name : '';
  }

  function render() {
    const term = $('#search').value.trim().toLowerCase();
    const visible = records.filter(record => (filter === 'all' || record.state === filter) && (record.name + ' ' + record.desc + ' ' + record.en).toLowerCase().includes(term));
    $('#cards').innerHTML = visible.map(record => `<button type="button" class="rg-card" data-id="${record.id}" aria-haspopup="dialog" aria-controls="detail-dialog"><span class="rg-card__index">${String(record.id).padStart(2,'0')}</span><span class="rg-card__main"><svg class="rg-icon rg-icon--48" aria-hidden="true"><use href="#rg-i-${record.type}"/></svg><span class="rg-card__content"><span class="rg-card__title">${esc(record.name)}</span><span class="rg-status ${record.state === 'active' ? '' : 'rg-status--' + record.state}">${labels[record.state]}</span></span><span class="rg-card__arrow"><svg class="rg-icon" aria-hidden="true"><use href="#rg-i-arrow"/></svg></span></span><span class="rg-card__footer"><span><span class="rg-card__description">${esc(record.desc || '暂无说明')}</span><span class="rg-card__meta">${esc(record.en)}</span></span><time datetime="${record.date}">${record.date.slice(5).replace('-','.')}</time></span></button>`).join('') || '<div class="rg-empty" style="grid-column:1/-1"><h3>没有找到相关项目</h3><p>试试其他关键词或筛选条件。</p><button type="button" class="rg-button rg-button--secondary" id="reset">清除搜索与筛选</button></div>';
    $('#results').textContent = '显示 ' + visible.length + ' 个项目 / 总计 ' + records.length + ' 个';
    $('#count').textContent = String(records.length).padStart(2,'0');
    $('#count').setAttribute('aria-label', '总计 ' + records.length + ' 个项目');
    updateSelection();
  }

  function resetFilters() {
    $('#search').value = '';
    // Use the component action so its selected state and keyboard position stay in sync.
    $('#filters [data-value="all"]').click();
    filter = 'all';
    render();
  }

  function validateField(field) {
    field.setCustomValidity('');
    if (field.name === 'name' && !field.value.trim()) field.setCustomValidity('请输入项目名称，不能只填空格。');
    else if (field.maxLength > -1 && field.value.length > field.maxLength) field.setCustomValidity('请将内容缩短到 ' + field.maxLength + ' 个字符以内。');
    const valid = field.validity.valid;
    field.setAttribute('aria-invalid', String(!valid));
    $('#project-' + field.name + '-error').textContent = valid ? '' : field.validationMessage;
    return valid;
  }

  $('#search').addEventListener('input', render);
  $('#filters').addEventListener('rg:change', event => {
    filter = event.detail.value;
    render();
    RasterUI.reveal($('#cards'), {children:'.rg-card'});
  });
  $('#display-control').addEventListener('rg:change', event => {
    $('#cards').classList.toggle('rg-card-grid--list', event.detail.value === 'list');
  });
  $('#compact-control').addEventListener('change', event => {
    if (event.target.checked) $('#workspace-main').dataset.rgDensity = 'compact';
    else $('#workspace-main').removeAttribute('data-rg-density');
  });
  $('#cards').addEventListener('click', event => {
    const button = event.target.closest('button');
    if (!button) return;
    if (button.id === 'reset') { resetFilters(); $('#search').focus(); return; }
    const record = records.find(item => item.id === Number(button.dataset.id));
    if (!record) return;
    selectedId = record.id;
    updateSelection(); // Keep the opener mounted so the dialog can return focus.
    $('#detail-title').textContent = record.name;
    $('#detail-description').textContent = record.desc || '暂无说明';
    $('#detail-status').textContent = labels[record.state];
    $('#detail-status').className = 'rg-status ' + (record.state === 'active' ? '' : 'rg-status--' + record.state);
    RasterUI.openDialog('detail-dialog', button);
  });
  // Suppress floating browser UI, while retaining native constraints and validity APIs.
  form.addEventListener('invalid', event => event.preventDefault(), true);
  fields.forEach(field => field.addEventListener('input', () => {
    if (field.getAttribute('aria-invalid') === 'true') validateField(field);
    else field.setCustomValidity('');
  }));
  form.addEventListener('submit', async event => {
    event.preventDefault();
    if (creating) return;
    fields.forEach(validateField);
    if (!form.checkValidity()) {
      const invalid = fields.find(field => !field.validity.valid);
      invalid.focus();
      RasterUI.feedback(invalid, 'error');
      return;
    }
    const draft = {name:form.elements.name.value.trim(),desc:form.elements.description.value.trim()};
    const submit = event.submitter || form.querySelector('[type="submit"]');
    creating = true;
    RasterUI.setLoading(submit, true, '正在创建');
    try {
      const closed = await RasterUI.closeDialog('create-dialog', 'created');
      if (!closed) return;
      const now = new Date();
      const date = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2,'0') + '-' + String(now.getDate()).padStart(2,'0');
      const record = {...draft,id:nextId++,type:'folder',state:'pending',en:'New Project',date};
      records.unshift(record);
      selectedId = record.id;
      resetFilters();
      form.reset();
      fields.forEach(field => {
        field.setCustomValidity('');
        field.removeAttribute('aria-invalid');
        $('#project-' + field.name + '-error').textContent = '';
      });
      RasterUI.reveal($('#cards'), {children:'.rg-card'});
      RasterUI.toast('已创建演示项目。');
    } finally {
      creating = false;
      RasterUI.setLoading(submit, false);
    }
  });
  render();
});
</script>
</body>
</html>
