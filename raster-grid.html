<div class="page">

<main class="main" id="main">

<dialog id="detail-dialog" aria-labelledby="detail-name"><div class="dialog-head"><h2>项目详情</h2><button class="icon-button" data-close="detail-dialog" aria-label="关闭项目详情"><svg class="icon"><use href="#i-close"/></svg></button></div><div class="dialog-body" id="detail-body"></div></dialog>

<script>
(()=>{'use strict';
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=(name,cls='')=>`<svg class="icon ${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const seed=[{id:'design-system',name:'设计系统',description:'统一产品的视觉与交互规范',english:'Design System',type:'design',status:'active',updated:'2026-10-08',archived:false},{id:'product-website',name:'产品网站',description:'官网重构与内容建设',english:'Product Website',type:'web',status:'todo',updated:'2026-10-07',archived:false},{id:'mobile-application',name:'移动应用',description:'iOS 与 Android 客户端',english:'Mobile Application',type:'phone',status:'active',updated:'2026-10-06',archived:false},{id:'component-docs',name:'组件文档',description:'组件使用说明与示例',english:'Component Docs',type:'doc',status:'done',updated:'2026-10-05',archived:false}];
let projects=seed.map(p=>({...p})),filter='all',view='projects',selected='design-system',toastTimer,storageAvailable=true;
const statusNames={active:'进行中',todo:'待开始',done:'已完成'},typeNames={design:'设计系统',web:'产品网站',phone:'移动应用',doc:'组件文档'};
try{const saved=JSON.parse(localStorage.getItem('raster-grid.projects.v1')||'null');if(Array.isArray(saved)&&saved.length&&saved.every(p=>p&&typeof p.id==='string'&&typeof p.name==='string'&&typeof p.description==='string'&&Object.hasOwn(statusNames,p.status)&&Object.hasOwn(typeNames,p.type)&&/^\d{4}-\d{2}-\d{2}$/.test(p.updated)&&typeof p.archived==='boolean'))projects=saved;}catch{storageAvailable=false;}
function save(){try{localStorage.setItem('raster-grid.projects.v1',JSON.stringify(projects));}catch{storageAvailable=false;showToast('浏览器暂时无法保存，项目保留到本页关闭。');}}
function today(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');}
const glyphs={R:['11110','10001','10001','11110','10100','10010','10001'],A:['01110','10001','10001','11111','10001','10001','10001'],S:['01111','10000','10000','01110','00001','00001','11110'],T:['11111','00100','00100','00100','00100','00100','00100'],E:['11111','10000','10000','11110','10000','10000','11111'],G:['01111','10000','10000','10111','10001','10001','01110'],I:['111','010','010','010','010','010','111'],D:['11110','10001','10001','10001','10001','10001','11110'],' ':['000','000','000','000','000','000','000'],0:['01110','11011','11011','11011','11011','11011','01110'],1:['00100','01100','00100','00100','00100','00100','01110'],2:['11110','00011','00011','01110','11000','11000','11111'],3:['11110','00011','00011','01110','00011','00011','11110'],4:['11011','11011','11011','11111','00011','00011','00011'],5:['11111','11000','11000','11110','00011','00011','11110'],6:['01110','11000','11000','11110','11011','11011','01110'],7:['11111','00011','00110','00110','01100','01100','01100'],8:['01110','11011','11011','01110','11011','11011','01110'],9:['01110','11011','11011','01111','00011','00011','01110']};
function bitmap(el,text){let x=0,rects='';for(const char of text){const rows=glyphs[char]||glyphs[' '];rows.forEach((row,y)=>[...row].forEach((v,i)=>{if(v==='1')rects+=`<rect x="${x+i}" y="${y}" width="1" height="1"/>`;}));x+=rows[0].length+1;}el.setAttribute('viewBox',`0 0 ${x-1} 7`);el.setAttribute('width',String((x-1)*8));el.innerHTML=rects;}
bitmap($('#wordmark'),'RASTER GRID');
function status(p){return `<span class="status"><span class="status-square ${p.status}" aria-hidden="true"></span>${p.archived?'已归档':statusNames[p.status]}</span>`;}
function showToast(text){clearTimeout(toastTimer);$('#toast').textContent=text;$('#toast').classList.add('visible');toastTimer=setTimeout(()=>$('#toast').classList.remove('visible'),2800);}
function renderNav(){const navs=[['overview','grid','概览'],['projects','folder','项目'],['resources','data','资源'],['settings','gear','设置']];$$('[data-nav]').forEach(nav=>{nav.innerHTML=navs.map(([id,ic,name])=>`<button class="nav-button" data-view="${id}" ${view===id?'aria-current="page"':''}>${icon(ic)}<span>${name}</span></button>`).join('');});}
function renderProjects(){const q=$('#search').value.trim().toLowerCase();const list=projects.filter(p=>(filter==='archived'?p.archived:!p.archived&&(filter!=='active'||p.status==='active'))&&`${p.name} ${p.description} ${p.english||''}`.toLowerCase().includes(q)).sort((a,b)=>b.updated.localeCompare(a.updated));
$$('[data-filter]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.filter===filter)));$('#clear-search').hidden=!q;
$('#projects-grid').innerHTML=list.map((p,i)=>`<button class="project-card ${p.id===selected?'is-selected':''}" data-project="${esc(p.id)}" aria-label="查看${esc(p.name)}，${p.archived?'已归档':statusNames[p.status]}"><span class="card-index mono">${String(i+1).padStart(2,'0')}</span><div class="card-main">${icon(p.type,'project-icon')}<div class="card-heading"><h2 class="card-title">${esc(p.name)}</h2>${status(p)}</div>${icon('arrow','card-arrow')}</div><div class="card-bottom"><div><div class="card-desc">${esc(p.description||'暂无说明')}</div><div class="card-english">${esc(p.english||typeNames[p.type])}</div></div><time class="card-date mono" datetime="${esc(p.updated)}">${p.updated.slice(5).replace('-','.')}</time></div></button>`).join('')||`<div class="empty-state">${icon('folder')}<h2>${q?'没有找到相关项目':filter==='archived'?'还没有已归档项目':'暂时没有进行中的项目'}</h2><p>${q?'试试其他关键词，或清除搜索。':filter==='archived'?'已归档的项目会保留在这里。':'新建项目，或在详情中调整项目状态。'}</p><button class="pixel-button secondary" data-reset>查看全部项目</button></div>`;
$('#result-count').textContent=q?`找到 ${list.length} 个项目`:`共 ${list.length} 个${filter==='archived'?'已归档':''}项目`;
const n=projects.filter(p=>!p.archived).length;bitmap($('#project-count'),String(n).padStart(2,'0'));$('#project-count').setAttribute('aria-label',`${n} 个项目`);
}
function resourceRows(list){return list.map(p=>`<button class="resource-row" data-project="${esc(p.id)}">${icon(p.type)}<span><span class="resource-title">${esc(p.name)}</span><span class="resource-sub">${esc(p.description)}</span></span>${icon('arrow','card-arrow')}</button>`).join('');}
function renderSecondary(){const active=projects.filter(p=>!p.archived);if(view==='overview'){$('#secondary-view').innerHTML=`<div class="overview-counts">${['active','todo','done'].map(s=>`<div class="overview-stat"><span>${statusNames[s]}</span><strong>${String(active.filter(p=>p.status===s).length).padStart(2,'0')}</strong></div>`).join('')}</div><h2 class="view-heading">最近更新</h2>${resourceRows([...active].sort((a,b)=>b.updated.localeCompare(a.updated)).slice(0,4))}`;}else if(view==='resources'){$('#secondary-view').innerHTML=`<div style="padding-top:24px"><h2 class="view-heading">规范与文档</h2>${resourceRows(active.filter(p=>['design','doc'].includes(p.type)))||'<p>暂无规范与文档项目。</p>'}</div>`;}else if(view==='settings'){$('#secondary-view').innerHTML=`<div class="settings-row"><span>紧凑间距<small>减少条目之间的留白</small></span><label class="check-label"><input type="checkbox" id="compact-setting" aria-label="紧凑间距" ${document.body.classList.contains('compact')?'checked':''}></label></div><div class="settings-row"><span>灰度查看<small>检查去掉强调色后的像素表现</small></span><label class="check-label"><input type="checkbox" id="mono-setting" aria-label="灰度查看" ${document.body.classList.contains('monochrome')?'checked':''}></label></div><p class="settings-note">这是界面探索用的本地演示。项目${storageAvailable?'保存在当前浏览器中':'仅保留到当前页面关闭'}，不会上传到服务器。</p>`;}}
function setView(next){view=next;const titles={projects:['项目','把工作保持有序'],overview:['概览','工作空间，一目了然'],resources:['资源','规范与文档，随时查阅'],settings:['设置','调整你的工作空间']};$('#page-title').textContent=titles[view][0];$('#page-subtitle').textContent=titles[view][1];$('#projects-view').hidden=view!=='projects';$('#secondary-view').hidden=view==='projects';$('#mobile-search').hidden=view!=='projects';renderNav();renderProjects();renderSecondary();}
function openNew(){$('#new-form').reset();$('#new-dialog').showModal();setTimeout(()=>$('#new-form input').focus(),30);}
function openDetail(id){const p=projects.find(p=>p.id===id);if(!p)return;selected=id;renderProjects();$('#detail-body').innerHTML=`<div class="detail-top">${icon(p.type)}<div><h3 id="detail-name">${esc(p.name)}</h3>${status(p)}</div></div><p class="detail-desc">${esc(p.description||'这个项目暂时没有说明。')}</p><dl class="detail-meta"><div><dt>项目类型</dt><dd>${typeNames[p.type]}</dd></div><div><dt>最近更新</dt><dd class="mono">${esc(p.updated)}</dd></div></dl><label class="field" style="margin-top:26px">项目状态<select id="detail-status" ${p.archived?'disabled':''}>${Object.entries(statusNames).map(([s,n])=>`<option value="${s}" ${p.status===s?'selected':''}>${n}</option>`).join('')}</select></label><div class="dialog-actions"><button class="text-button" id="archive-project">${p.archived?'移出归档':'归档项目'}</button><button class="pixel-button" id="save-detail">保存并关闭</button></div>`;$('#detail-dialog').showModal();$('#archive-project').onclick=()=>{p.archived=!p.archived;p.updated=today();save();$('#detail-dialog').close();renderProjects();renderSecondary();showToast(p.archived?'项目已归档，可在「已归档」中查看':'项目已移回工作空间');};$('#save-detail').onclick=()=>{const next=$('#detail-status').value;if(next!==p.status){p.status=next;p.updated=today();save();showToast('项目状态已更新');}$('#detail-dialog').close();renderProjects();renderSecondary();};}
document.addEventListener('click',e=>{const el=e.target.closest('button');if(!el)return;if(el.dataset.view)setView(el.dataset.view);if(el.hasAttribute('data-new'))openNew();if(el.dataset.close)$('#'+el.dataset.close).close();if(el.dataset.project)openDetail(el.dataset.project);if(el.dataset.filter){filter=el.dataset.filter;renderProjects();}if(el.hasAttribute('data-reset')){filter='all';$('#search').value='';renderProjects();}});
$('#search').addEventListener('input',renderProjects);$('#clear-search').onclick=()=>{$('#search').value='';renderProjects();$('#search').focus();};$('#mobile-search').onclick=()=>{const box=$('#search-box'),open=!box.classList.contains('mobile-open');box.classList.toggle('mobile-open',open);$('#mobile-search').setAttribute('aria-expanded',String(open));if(open)$('#search').focus();};
$('#new-form').onsubmit=e=>{e.preventDefault();const data=new FormData(e.currentTarget),name=String(data.get('name')).trim();if(!name){$('#new-form input').setCustomValidity('请输入项目名称');$('#new-form input').reportValidity();return;}const type=String(data.get('type'));const p={id:'project-'+(globalThis.crypto?.randomUUID?.()||Date.now().toString(36)),name,description:String(data.get('description')).trim(),english:'',type,status:'todo',updated:today(),archived:false};projects.unshift(p);selected=p.id;save();filter='all';$('#search').value='';setView('projects');$('#new-dialog').close();showToast('项目已创建');};$('#new-form input').oninput=e=>e.target.setCustomValidity('');
$$('dialog').forEach(d=>d.addEventListener('click',e=>{const r=d.getBoundingClientRect();if(e.target===d&&(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom))d.close();}));
$('#control-toggle').onclick=()=>{const open=$('#control-strip').hidden;$('#control-strip').hidden=!open;$('#control-toggle').setAttribute('aria-expanded',String(open));};$('#sample-cancel').onclick=()=>showToast('已取消');$('#sample-segments').onclick=e=>{const b=e.target.closest('button');if(b)$$('button',$('#sample-segments')).forEach(x=>x.setAttribute('aria-pressed',String(x===b)));};$('#sample-icons').innerHTML=['folder','web','doc','phone','data','gear'].map(x=>icon(x)).join('');
$('#secondary-view').addEventListener('change',e=>{if(e.target.id==='compact-setting')document.body.classList.toggle('compact',e.target.checked);if(e.target.id==='mono-setting')document.body.classList.toggle('monochrome',e.target.checked);});
renderNav();renderProjects();
})();
</script>
