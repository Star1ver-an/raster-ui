<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Soft UI · Precision Neumorphism</title>
  <link rel="stylesheet" href="soft-ui.css">
  <link rel="stylesheet" href="../material-ui.css?v=0.2.1">
  <script defer src="../material-ui.js?v=0.2.1"></script>
</head>
<body class="soft-root">
  <div class="soft-shell">
    <header class="soft-top">
      <div class="soft-brand">
        <div class="soft-brand-mark" aria-hidden="true"><i></i></div>
        <div>
          <h1 class="soft-title">Soft UI</h1>
          <p class="soft-subtitle">Precision surfaces · 细腻触感与克制层次</p>
        </div>
      </div>
      <button class="soft-theme-toggle" id="themeToggle" type="button" aria-label="切换深色模式" aria-pressed="false"><i></i></button>
    </header>

    <div class="soft-layout">
      <aside class="soft-side">
        <nav class="soft-nav" aria-label="组件目录">
          <p class="soft-nav-label">基础</p>
          <a href="#material-foundations" aria-current="page"><svg viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></svg><span>基础组件</span></a>
          <a href="#material-icons"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg><span>图标</span></a>
          <p class="soft-nav-label">控件</p>
          <a href="#material-buttons"><svg viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg><span>按钮</span></a>
          <a href="#material-fields"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="3"/><path d="M8 12h8"/></svg><span>表单</span></a>
          <a href="#material-selection"><svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="3"/></svg><span>选择</span></a>
          <p class="soft-nav-label">结构</p>
          <a href="#material-filters"><svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h9M5 17h6"/></svg><span>筛选</span></a>
          <a href="#material-tabs"><svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h14"/></svg><span>页签</span></a>
          <a href="#material-navigation"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="5" height="16" rx="1"/><path d="M13 7h7M13 12h7M13 17h5"/></svg><span>导航</span></a>
          <p class="soft-nav-label">内容</p>
          <a href="#material-cards"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="3"/><path d="M8 10h8M8 14h5"/></svg><span>卡片</span></a>
          <a href="#material-status"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg><span>状态</span></a>
          <a href="#material-empty-loading"><svg viewBox="0 0 24 24"><path d="M5 8h14v10H5zM8 8V6h8v2"/></svg><span>空状态</span></a>
          <a href="#material-feedback"><svg viewBox="0 0 24 24"><path d="M5 6h14v10H9l-4 3z"/><path d="M8 10h8"/></svg><span>反馈</span></a>
          <p class="soft-nav-label">接入</p>
          <a href="#material-composition"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="7" height="14" rx="2"/><rect x="13" y="5" width="7" height="6" rx="2"/><rect x="13" y="13" width="7" height="6" rx="2"/></svg><span>页面组合</span></a>
          <a href="#material-usage"><svg viewBox="0 0 24 24"><path d="M6 5h12v14H6zM9 9h6M9 13h6M9 17h4"/></svg><span>快速接入</span></a>
          <a href="#material-motion"><svg viewBox="0 0 24 24"><path d="M5 12h4l2-7 3 14 2-7h3"/></svg><span>动效实验室</span></a>
        </nav>
      </aside>

      <main class="soft-main">
        <section class="rg-root material-library" data-material-library aria-label="Soft UI 组件库"></section>
      </main>
    </div>
  </div>

<script>
const body = document.body;
const themeToggle = document.getElementById('themeToggle');
if (new URLSearchParams(location.search).get('theme') === 'dark') {
  body.dataset.theme = 'dark';
  themeToggle.setAttribute('aria-pressed', 'true');
}
themeToggle.addEventListener('click', () => {
  const dark = body.dataset.theme === 'dark';
  body.dataset.theme = dark ? 'light' : 'dark';
  themeToggle.setAttribute('aria-pressed', String(dark));
  themeToggle.setAttribute('aria-label', dark ? '切换浅色模式' : '切换深色模式');
});
</script>
</body>
</html>
